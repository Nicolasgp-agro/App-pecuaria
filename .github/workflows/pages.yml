name: Publicar Hato Claro
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sábados y lunes: trae los precios nuevos del ganado y vuelve a publicar
    - cron: "17 14 * * 6,1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar precios del ganado (Fedegán)
        continue-on-error: true
        run: |
          pip install --quiet pandas lxml
          python scripts/actualizar_precios.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
