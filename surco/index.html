<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surco Claro</title>
<meta name="description" content="Registro de lotes y siembras: jornales, insumos, maquinaria, ventas y fotos de facturas.">
<meta name="theme-color" content="#2f6a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surco Claro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Surco Claro — una columna pensada para el celular, siembra activa arriba y secciones abajo. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e7ebe2; --line:#d6ddd1;
  --fg:#1b2419; --fg2:#4b5848; --muted:#76836f;
  --brand:#2f6a3a; --brand-ink:#ffffff; --brand-soft:#dcebdc;
  --earth:#7a5532; --earth-soft:#efe4d8;
  --ok:#1f7a3a; --bad:#b3261e; --bad-soft:#f8dcd8;
  --c-jornal:#2a78d6; --c-semilla:#7a5532; --c-abono:#2f8f5b; --c-agroq:#9a4fc9; --c-maq:#d07a10; --c-otro:#7d8a79;
  --f-display:"Archivo Narrow","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tab-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand img{width:28px;height:28px;border-radius:7px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.ciclo-sel{flex:1;min-width:0}
.ciclo-sel select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-weight:600;font-size:.95rem}
main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + 32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .row{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto}
nav.tabs button{background:none;border:0;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs button.add .pill{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:4px 16px;display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:.82rem;color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.bar-row .track{grid-column:1/-1;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:5px}
.bar-row .lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--sunk)}
.item .ic img{width:100%;height:100%;object-fit:cover}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .d{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .m{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mes-h{font-family:var(--f-display);font-weight:700;color:var(--fg2);display:flex;justify-content:space-between;gap:8px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
form{display:flex;flex-direction:column;gap:14px;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--fg2);min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:1rem;color:var(--fg);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.total-box{display:flex;justify-content:space-between;align-items:baseline;background:var(--brand-soft);border-radius:10px;padding:12px 14px}
.total-box b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-align:center;text-decoration:none;display:inline-block}
.btn.sec{background:var(--sunk);color:var(--fg)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .pdf{display:grid;place-items:center;height:100%;font-weight:700;color:var(--fg2)}
.foto .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-weight:700;line-height:1}
.add-foto{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--muted);display:grid;place-items:center;text-align:center;font-size:.78rem;font-weight:600;color:var(--fg2);cursor:pointer;background:none;padding:4px}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{border-radius:10px;padding:10px 12px;font-size:.9rem;background:var(--earth-soft)}
.sat{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.lote-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--sunk);color:var(--fg2);white-space:nowrap}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon-btn{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.15rem;flex:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.big-foto{width:100%;border-radius:10px;display:block;min-height:60px;background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.status{font-size:.85rem;color:var(--muted);text-align:center}
.estado-nube{display:flex;align-items:center;gap:8px;font-size:.9rem}
.update-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:736px;margin:0 auto}
.update-bar button{background:var(--brand-ink);color:var(--brand);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><img src="icons/icon-192.png" alt=""><b>Surco Claro</b></div>
    <div class="ciclo-sel"><select id="sel-ciclo" aria-label="Siembra activa"></select></div>
  </div>
</header>
<main id="app"><p class="status">Cargando…</p></main>
<nav class="tabs" aria-label="Secciones">
  <div class="row">
    <button data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
    <button data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Registros</button>
    <button data-tab="registrar" class="add"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span>Registrar</button>
    <button data-tab="lotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>Lotes</button>
    <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
  </div>
</nav>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<input type="file" id="file-in" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-respaldo" accept="application/json,.json" hidden>
<script src="app.js" defer></script>
</body>
</html>
